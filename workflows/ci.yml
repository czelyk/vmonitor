name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  userspace-build:
    name: Build userspace components
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build server
        run: |
          make -C server

      - name: Build CLI
        run: |
          make -C cli

  kernel-build:
    name: Build kernel module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-$(uname -r) || true

      - name: Build kernel module
        run: |
          make -C kernel